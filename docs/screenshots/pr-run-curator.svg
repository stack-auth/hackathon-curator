<svg width="1200" height="720" viewBox="0 0 1200 720" xmlns="http://www.w3.org/2000/svg">
  <title>Run Curator button on a GitHub pull request</title>
  <rect width="1200" height="720" fill="#f8fafc"/>
  <rect x="40" y="40" width="1120" height="640" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <rect x="40" y="40" width="1120" height="72" rx="18" fill="#0f172a"/>
  <text x="80" y="86" font-family="Inter, Arial, sans-serif" font-size="24" fill="#f8fafc">GitHub PR • Add risk scoring</text>
  <rect x="900" y="56" width="210" height="40" rx="20" fill="#0ea5e9"/>
  <text x="932" y="82" font-family="Inter, Arial, sans-serif" font-size="18" fill="#ffffff">Run Curator</text>

  <rect x="80" y="140" width="1040" height="44" rx="10" fill="#f1f5f9"/>
  <text x="102" y="168" font-family="Inter, Arial, sans-serif" font-size="18" fill="#334155">app/handlers/review.ts</text>

  <text x="102" y="220" font-family="Menlo, Consolas, monospace" font-size="18" fill="#ef4444">- const riskScore = 0.42</text>
  <text x="102" y="250" font-family="Menlo, Consolas, monospace" font-size="18" fill="#22c55e">+ const riskScore = 0.67</text>
  <text x="102" y="280" font-family="Menlo, Consolas, monospace" font-size="18" fill="#22c55e">+ const rationale = summarize(diff)</text>

  <rect x="80" y="320" width="1040" height="44" rx="10" fill="#f1f5f9"/>
  <text x="102" y="348" font-family="Inter, Arial, sans-serif" font-size="18" fill="#334155">app/ui/overview.tsx</text>

  <text x="102" y="400" font-family="Menlo, Consolas, monospace" font-size="18" fill="#ef4444">- &lt;Badge&gt;Manual review&lt;/Badge&gt;</text>
  <text x="102" y="430" font-family="Menlo, Consolas, monospace" font-size="18" fill="#22c55e">+ &lt;Badge variant="warning"&gt;Curator&lt;/Badge&gt;</text>

  <rect x="80" y="480" width="360" height="160" rx="16" fill="#e2e8f0"/>
  <text x="104" y="520" font-family="Inter, Arial, sans-serif" font-size="16" fill="#334155">Curator prompts reviewers</text>
  <text x="104" y="548" font-family="Inter, Arial, sans-serif" font-size="16" fill="#334155">right on the diff</text>
</svg>
